<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskWise · AI Chatbot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Formats the bot's replies (bold, lists, code) safely -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div class="layout">

    <!-- ===== Sidebar: chat history ===== -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Chat History</span>
        <button id="closeSidebar" class="icon-btn sidebar-close" title="Close menu" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <button id="newChatSidebar" class="new-chat-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New chat
      </button>

      <div id="chatList" class="chat-list"></div>

      <button id="clearAll" class="clear-all-btn">Clear all chats</button>
    </aside>

    <!-- Dark background behind the sidebar on mobile -->
    <div id="overlay" class="overlay"></div>

    <!-- ===== Main chat area ===== -->
    <div class="main">
      <div class="app">

        <!-- Top bar -->
        <header class="topbar">
          <div class="brand-wrap">
            <button id="menuBtn" class="icon-btn menu-btn" title="Chat history" aria-label="Open chat history">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M3 12h18M3 18h18"/>
              </svg>
            </button>
            <div class="brand">
              <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                  <path d="M9 18h6"/>
                  <path d="M10 22h4"/>
                </svg>
              </div>
              <div>
                <h1>AskWise</h1>
                <span class="status"><span class="dot"></span>Online</span>
              </div>
            </div>
          </div>
          <div class="actions">
            <button id="themeToggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
            <button id="clearChat" class="icon-btn" title="New chat" aria-label="New chat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Chat area -->
        <main id="chat" class="chat">
          <section id="welcome" class="welcome">
            <div class="welcome-logo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                <path d="M9 18h6"/>
                <path d="M10 22h4"/>
              </svg>
            </div>
            <h2>Hi, I'm AskWise</h2>
            <p>Your AI assistant. Ask me anything: ideas, explanations, code, or just a chat.</p>
            <div class="suggestions">
              <button class="chip">Explain machine learning in simple words</button>
              <button class="chip">Give me 3 tips for a strong CV</button>
              <button class="chip">Write a Python function to reverse a string</button>
              <button class="chip">Suggest a productive daily routine</button>
            </div>
          </section>
        </main>

        <!-- Message input -->
        <form id="chatForm" class="composer">
          <textarea id="userInput" rows="1" placeholder="Type your message..."></textarea>
          <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </form>
        <p class="footnote">AskWise can make mistakes. Check important info.</p>

      </div>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
